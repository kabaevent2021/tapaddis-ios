name: TapAddisCustomer
options:
  bundleIdPrefix: com.tapaddis
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TapAddis:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: TapAddisCustomer
        excludes:
          - Assets.xcassets
    resources:
      - TapAddisCustomer/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: TapAddis
        PRODUCT_BUNDLE_IDENTIFIER: com.tapaddis.customer
        INFOPLIST_FILE: TapAddisCustomer/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
